[project]
name = "transcribe-engine"
version = "0.1.0"
description = "Self-hostable transcription engine for the Transcribe webapp"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "artriv" }]
dependencies = [
  # Bundling — locked R-02 (spike-validated 2026-05-01)
  "pyinstaller>=6.20",
  "pystray>=0.19.5",
  "Pillow>=12",
  # Pipeline — locked R-02 (matches v1 backend stack)
  "pyannote.audio>=3.4,<4",
  "torch>=2.5,<2.7",
  "torchaudio>=2.5,<2.7",
  "lightning>=2.6,<3",
  # Cross-platform paths — RESEARCH "Don't Hand-Roll"
  "platformdirs>=4",
  # Phase 8: WebRTC + signaling transport (Wave-0 spike-validated 2026-05-04)
  # aiortc: Python WebRTC implementation (RTCPeerConnection + RTCDataChannel + ICE)
  # Binary wheels available for Linux/macOS/Windows; asyncio-native.
  "aiortc>=1.13,<2",
  # pynacl: libsodium binding for Ed25519 sign/verify (D-01 challenge-response)
  # Deterministic signing; no nonce-reuse footgun. PyInstaller-clean.
  "pynacl>=1.5,<2",
  # realtime: standalone supabase-realtime-py client (D-17 Supabase Realtime pivot)
  # Pure Phoenix Channels over websockets — no Supabase user JWT, no DB, no Storage.
  # Explicitly allowed by engine perimeter sentinel (see tests/test_no_supabase_in_engine.py).
  "realtime>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  # Pinned, not floating: `ruff>=0.6` let CI install whatever ruff was newest that
  # day, so new lint rules landed as red builds on commits that changed no code.
  "ruff==0.15.12",
]

[project.scripts]
transcribe-engine = "transcribe_engine.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["transcribe_engine"]

# Force CPU-only torch wheel (no CUDA payload — engine uses CPU for pyannote + Vulkan
# for whisper.cpp via subprocess; torch in the bundle is for pyannote CPU diarization only)
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# CLAUDE.md — ruff for lint + format
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Carry from v1 backend conventions: pyflakes + pycodestyle + isort + bugbear
select = ["F", "E", "W", "I", "B", "UP"]
ignore = ["E501"]  # line-length handled by formatter

# Test config — RESEARCH §"Validation Architecture"
[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "gpu: requires a real GPU (skipped in CI per D-04)",
  "slow: requires real model weights, long-running fixtures, or PyInstaller builds (opt-in via -m slow or RUN_SPIKE=1)",
]
testpaths = ["tests"]
addopts = "-x"
