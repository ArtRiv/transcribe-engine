[project]
name = "transcribe-engine"
version = "0.1.0"
description = "Self-hostable transcription engine for the Transcribe webapp"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "artriv" }]
dependencies = [
  # Bundling — locked R-02 (spike-validated 2026-05-01)
  "pyinstaller>=6.20",
  "pystray>=0.19.5",
  "Pillow>=12",
  # Pipeline — locked R-02 (matches v1 backend stack)
  "pyannote.audio>=3.4,<4",
  "torch>=2.5,<2.7",
  "torchaudio>=2.5,<2.7",
  "lightning>=2.6,<3",
  # Cross-platform paths — RESEARCH "Don't Hand-Roll"
  "platformdirs>=4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[project.scripts]
transcribe-engine = "transcribe_engine.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["transcribe_engine"]

# Force CPU-only torch wheel (no CUDA payload — engine uses CPU for pyannote + Vulkan
# for whisper.cpp via subprocess; torch in the bundle is for pyannote CPU diarization only)
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# CLAUDE.md — ruff for lint + format
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Carry from v1 backend conventions: pyflakes + pycodestyle + isort + bugbear
select = ["F", "E", "W", "I", "B", "UP"]
ignore = ["E501"]  # line-length handled by formatter

# Test config — RESEARCH §"Validation Architecture"
[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "gpu: requires a real GPU (skipped in CI per D-04)",
  "slow: requires real model weights or long-running fixtures",
]
testpaths = ["tests"]
addopts = "-x"
