name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    name: Lint + Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Sync deps
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check transcribe_engine tests

      - name: Format check (ruff format --check)
        run: uv run ruff format --check transcribe_engine tests

      - name: Tests (skip gpu + slow markers per D-04)
        env:
          MOCK_ENGINE: "1"
          SKIP_VULKAN_PROBE: "1"
        run: uv run pytest -x -m "not gpu and not slow" --tb=short
